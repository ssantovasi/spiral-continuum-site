<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Control — Steven Saint</title>
<meta name="description" content="Live progress across the Saints' two-series universe — The Island of Bones and The Spiral Continuum.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root{ --bg:#06100c; --panel:#0d1b16; --panel2:#0a1712; --ink:#e9efe6; --dim:#9fb0a4;
         --line:rgba(150,190,170,.16); --island:#e3c079; --spiral:#cdbb86;
         --teal:#7fc6ad; --green:#5fbf7a; --amber:#e0a85a; --grey:#4a5a52; --red:#e0655a; }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1300px 800px at 80% -10%,#0c2018,#06100c 60%);color:var(--ink);
       font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif;font-size:15px}
  .wrap{max-width:1320px;margin:0 auto;padding:1.1rem clamp(.7rem,2.5vw,1.8rem) 4rem}
  a{color:var(--teal);text-decoration:none}
  header{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;padding:.3rem 0 .9rem;border-bottom:1px solid var(--line)}
  header h1{font-family:Georgia,serif;font-size:1.4rem;margin:0;color:#f3eeda}
  header h1 b{color:var(--island)}
  .back{font-size:.72rem;letter-spacing:.06em;color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:.35rem .7rem}
  .back:hover{border-color:var(--teal);color:var(--teal)}
  .snap{display:flex;align-items:center;gap:.4rem;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal)}
  .clock{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--dim);font-size:.82rem}
  .legend{display:flex;gap:1rem;flex-wrap:wrap;margin:1rem 0 .2rem;font-size:.72rem;color:var(--dim)}
  .legend span{display:inline-flex;align-items:center;gap:.35rem}
  .lp{width:10px;height:10px;border-radius:50%}
  /* series + cards */
  .series-h{display:flex;align-items:baseline;gap:.7rem;margin:1.6rem 0 .5rem}
  .series-h .nm{font-family:Georgia,serif;font-size:1.3rem}
  .sum{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.7rem}
  .sum .chip{font-size:.7rem;padding:.2rem .5rem;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .sum .chip b{color:var(--ink)}
  .bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.35rem .9rem;margin:.2rem 0 .8rem}
  .bar{display:flex;align-items:center;gap:.5rem;font-size:.7rem;color:var(--dim)}
  .bar .bl{width:84px;text-align:right} .bar .bv{width:34px;color:var(--ink)}
  .bar .bt{flex:1;height:6px;border-radius:3px;background:rgba(150,190,170,.12);overflow:hidden}
  .bar .bf{display:block;height:100%}
  .rc{font-size:.76rem;padding:.22rem 0;border-top:1px solid rgba(150,190,170,.07)}
  .rc:first-child{border-top:none} .rc code{color:var(--dim);font-family:ui-monospace,monospace}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:.9rem}
  .card{display:flex;gap:.85rem;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.8rem;transition:border-color .2s}
  .card:hover{border-color:rgba(150,190,170,.34)}
  .thumb{width:86px;min-width:86px;height:128px;border-radius:7px;overflow:hidden;background:linear-gradient(160deg,#173a2d,#0a1f17);
    display:grid;place-items:center;border:1px solid var(--line)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .ph{font-family:Georgia,serif;font-size:1.6rem;color:rgba(227,192,121,.5)}
  .cbody{flex:1;min-width:0}
  .ct{font-size:1rem;color:var(--ink);line-height:1.2;margin-bottom:.45rem}
  .ct small{color:var(--grey)}
  .dims{display:flex;flex-wrap:wrap;gap:.3rem .5rem;margin-bottom:.45rem}
  .d{display:inline-flex;align-items:center;gap:.32rem;font-size:.72rem;color:var(--dim)}
  .d .lp{width:9px;height:9px}
  .d a{font-size:.7rem;margin-left:.1rem}
  .stats{display:flex;gap:.9rem;font-size:.74rem;color:var(--dim);border-top:1px solid rgba(150,190,170,.08);padding-top:.4rem}
  .stats b{color:var(--ink)}
  /* panels */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.2rem}
  @media(max-width:860px){.cols{grid-template-columns:1fr}.cards{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.2rem;margin-top:1.1rem}
  .panel h2{margin:0 0 .8rem;font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:600}
  ul.shelf{list-style:none;margin:0;padding:0} ul.shelf li{padding:.45rem 0;border-top:1px solid rgba(150,190,170,.07);font-size:.84rem}
  ul.shelf li:first-child{border-top:none} ul.shelf .ds{color:var(--dim);font-size:.76rem}
  .tbd li::before{content:"\25A2 ";color:var(--grey)}
  .auto{display:flex;flex-direction:column;gap:.15rem;font-size:.82rem;padding:.55rem 0;border-top:1px solid rgba(150,190,170,.07)}
  .auto:first-child{border-top:none} .auto .meta{color:var(--dim);font-size:.72rem}
  .badge-s{font-size:.58rem;text-transform:uppercase;color:#06120c;background:var(--teal);padding:.1rem .45rem;border-radius:999px;align-self:flex-start}
  .muted{color:var(--grey)}
  .err{color:var(--red);font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img id="headshot" alt="" style="display:none;width:38px;height:38px;border-radius:50%;object-fit:cover;border:1px solid var(--line)">
    <h1><b>&#9670;</b> Mission Control <span class="muted" style="font-size:.78rem">&middot; the Saints' universe</span></h1>
    <span class="snap"><span class="dot"></span> <span id="snaplabel">snapshot</span></span>
    <a class="back" href="/">&larr; stevensaintbooks.com</a>
    <span class="clock" id="clock"></span>
  </header>

  <div class="legend" id="legend"></div>
  <div id="seriesArea"></div>

  <div class="cols">
    <div class="panel"><h2>Automation &middot; scheduled</h2><div id="automation"></div></div>
    <div class="panel"><h2>TBD shelf</h2><ul class="shelf tbd" id="tbd"></ul></div>
  </div>
  <div class="cols">
    <div class="panel"><h2>Recent activity</h2><div id="recent"></div></div>
    <div class="panel"><h2>Tool shelf</h2><ul class="shelf" id="tools"></ul></div>
  </div>
</div>

<script>
/* Read-only published snapshot of Mission Control.
   All interactive controls (manual triggers, voice commands, editing, local
   quick-links, output console) are intentionally omitted — this is a view. */
let STATUS=null, META=null;
const COLORS={done:'#33e06e',complete:'#33e06e',published:'#22e3ee',in_progress:'#ffdb2d',planned:'#ff4d4d',todo:'#ff4d4d','n/a':'#26322c'};
const LABELS={done:'done',todo:'—',complete:'complete',published:'published',in_progress:'in progress',planned:'planned','n/a':'n/a'};
function col(s){return COLORS[s]||'var(--grey)'} function lab(s){return LABELS[s]||s}
function j(u){return fetch(u).then(r=>r.json())}
function clock(){document.getElementById('clock').textContent=new Date().toLocaleString()} setInterval(clock,1000); clock();
function roman(n){return ['','I','II','III','IV','V','VI','VII','VIII','IX'][n]||n}

async function loadAll(){
  try{
    [STATUS,META]=await Promise.all([j('./data/status.json'),j('./data/meta.json')]);
  }catch(e){
    document.getElementById('seriesArea').innerHTML='<p class="err">Could not load the snapshot data.</p>'; return;
  }
  legend(); renderSeries(); renderMeta();
}

function legend(){ document.getElementById('legend').innerHTML =
  [['published','published / live'],['complete','complete'],['in_progress','in progress'],['planned','planned'],['todo','not started']]
  .map(([s,t])=>`<span><span class="lp" style="background:${col(s)}"></span>${t}</span>`).join(''); }

function dimChip(dim,bdim){
  const st=(bdim&&bdim.state)||'todo', link=bdim&&bdim.link;
  return `<span class="d" title="${dim.label}: ${lab(st)}"><span class="lp" style="background:${col(st)}"></span>${dim.label}`
    + (link?` <a href="${link}" target="_blank" rel="noopener">↗</a>`:'') + `</span>`;
}

function card(b){
  const thumb = b.cover_url ? `<img src="${b.cover_url}" alt="" loading="lazy">` : `<span class="ph">${roman(b.n)}</span>`;
  const autoChips = STATUS.dimensions.filter(d=>d.src==='auto').map(d=>dimChip(d,b.dims[d.key])).join('');
  const manChips = STATUS.dimensions.filter(d=>d.src==='manual').map(d=>dimChip(d,b.dims[d.key])).join('');
  const st=b.stats||{};
  const statsDisp = `<div class="stats">`+STATUS.stats.map(s=>`<span>${s.label} <b>${(st[s.key]??0).toLocaleString()}</b></span>`).join('')
    +(st.updated?`<span class="muted">upd ${st.updated}</span>`:'')+`</div>`;
  return `<div class="card"><div class="thumb">${thumb}</div><div class="cbody">
     <div class="ct">${b.n}. ${b.title}</div>
     <div class="dims">${autoChips}</div>
     <div class="dims">${manChips}</div>
     ${statsDisp}</div></div>`;
}

function bars(s){
  const rows=[['written','Written'],['ad_script','Audio script'],['ad_audio','Audio rendered'],['kindle','Published'],['audiobook','Audiobook']];
  return `<div class="bars">`+rows.map(([k,lab])=>{
    const v=s.counts[k]||0, pct=s.total?Math.round(100*v/s.total):0;
    return `<div class="bar"><span class="bl">${lab}</span><span class="bt"><span class="bf" style="width:${pct}%;background:${s.accent}"></span></span><span class="bv">${v}/${s.total}</span></div>`;
  }).join('')+`</div>`;
}

function renderSeries(){
  const area=document.getElementById('seriesArea'); area.innerHTML='';
  for(const s of STATUS.series){
    const c=s.counts;
    const sum = `<span class="sum"><span class="chip">Written <b>${c.written}/${s.total}</b></span>
      <span class="chip">Audio script <b>${c.ad_script}/${s.total}</b></span>
      <span class="chip">Audio rendered <b>${c.ad_audio}/${s.total}</b></span>
      <span class="chip">Published <b>${c.kindle||0}/${s.total}</b></span>
      <span class="chip">Audiobook <b>${c.audiobook||0}/${s.total}</b></span></span>`;
    area.innerHTML += `<div class="series-h"><span class="nm" style="color:${s.accent}">${s.name}</span>
        <span class="muted" style="font-size:.74rem">${s.total} volumes &middot; ${(s.git_head||'').slice(0,8)}</span></div>
      ${sum}${bars(s)}<div class="cards" id="cards-${s.key}"></div>`;
    document.getElementById('cards-'+s.key).innerHTML = s.books.map(b=>card(b)).join('');
  }
}

function renderMeta(){
  document.getElementById('tools').innerHTML=(META.tools||[]).map(t=>`<li><b>${t.name}</b> <span class="muted">— ${t.repo}</span><br><span class="ds">${t.desc}</span></li>`).join('');
  document.getElementById('tbd').innerHTML=(META.tbd||[]).map(t=>`<li>${t.item} <span class="muted">&middot; ${t.series}</span></li>`).join('');
  document.getElementById('automation').innerHTML=(META.automation||[]).map(x=>`<div class="auto"><span class="badge-s">${x.kind}</span><b>${x.name}</b>
    <span class="meta">${x.schedule} &middot; ${x.status}</span><span class="meta">trigger: ${x.trigger}</span></div>`).join('');
  // recent activity (combined across both series)
  const rec = STATUS.series.flatMap(s=>(s.recent||[]).map(l=>({s:s.name.split(' ').pop(),l,a:s.accent})));
  document.getElementById('recent').innerHTML = rec.length
    ? rec.map(r=>`<div class="rc"><span style="color:${r.a}">${r.s}</span> <code>${r.l}</code></div>`).join('')
    : '<span class="muted">no recent commits</span>';
  // snapshot label + headshot
  if(META.snapshot) document.getElementById('snaplabel').textContent='snapshot · '+META.snapshot;
  const hs=document.getElementById('headshot');
  if(META.headshot){ hs.src='./headshot.jpg'; hs.style.display='block'; hs.onerror=()=>hs.style.display='none'; }
}

loadAll();
</script>
</body>
</html>
